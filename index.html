<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Het Limburgse Panel — leg je idee voor aan zes persona's</title>
<style>
  :root {
    --bg: #FFFFFF;
    --tekst: #000000;
    --tekst-zacht: #545454;
    --kaart-rand: #000000;
    --vlak-rand: #D6D6D6;
    --accent: #E81A32;
    --accent-tekst: #FFFFFF;
    --zwart: #000000;
    --wit: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }

  body { min-height: 100vh; }

  *:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  /* Header */
  .app-header {
    background: var(--zwart);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 20px 16px;
  }

  .logo {
    margin: 0 0 16px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--wit);
  }

  .voortgang {
    list-style: none;
    display: flex;
    gap: 8px;
    margin: 0;
    padding: 0;
  }

  .voortgang li {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: #B8B8B8;
    padding-bottom: 10px;
    border-bottom: 3px solid #3A3A3A;
  }

  .voortgang li .stap-nr {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #3A3A3A;
    color: var(--wit);
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .voortgang li.actief {
    color: var(--wit);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  .voortgang li.actief .stap-nr {
    background: var(--accent);
    color: var(--accent-tekst);
  }

  /* Schermen algemeen */
  .scherm h2 {
    margin: 8px 0 4px;
    font-size: 1.6rem;
    font-weight: 800;
  }

  .onderschrift {
    color: var(--tekst-zacht);
    margin: 0 0 24px;
  }

  label {
    display: block;
    font-weight: 600;
    margin: 20px 0 6px;
  }

  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: #FFFFFF;
    border: 1px solid var(--vlak-rand);
    border-radius: 4px;
    padding: 12px 14px;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--zwart);
  }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }

  .tag-btn {
    font: inherit;
    background: #FFFFFF;
    border: 1px solid var(--zwart);
    color: var(--tekst);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }

  .tag-btn.gekozen {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-tekst);
  }

  .acties {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 32px;
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  .btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-tekst);
    border-radius: 4px;
    padding: 12px 22px;
    font-weight: 700;
  }

  .btn:disabled {
    background: #E0E0E0;
    border-color: #E0E0E0;
    color: var(--tekst-zacht);
    cursor: not-allowed;
  }

  .btn-secundair {
    background: #FFFFFF;
    color: var(--tekst);
    border: 1px solid var(--zwart);
    border-radius: 4px;
    padding: 12px 22px;
    font-weight: 700;
  }

  /* Persona-raster */
  .persona-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .persona-card {
    text-align: left;
    background: #FFFFFF;
    border: 1px solid var(--vlak-rand);
    border-radius: 4px;
    padding: 18px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .persona-card.geselecteerd {
    border: 2px solid var(--zwart);
    padding: 17px;
  }

  .persona-card:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .persona-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--kleur, var(--accent));
    color: var(--kleur-tekst, #FFFFFF);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .persona-naam { font-weight: 700; }
  .persona-rol { color: var(--tekst-zacht); font-size: 0.9rem; }
  .persona-karakter { font-size: 0.95rem; margin: 0; }

  .vinkje {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #FFFFFF;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
  }

  .persona-card.geselecteerd .vinkje { display: flex; }

  .teller {
    margin: 18px 0 0;
    color: var(--tekst-zacht);
    font-size: 0.95rem;
  }

  /* Scherm 3 */
  .idee-samenvatting {
    margin-bottom: 24px;
  }

  .idee-samenvatting h2 {
    margin-bottom: 6px;
  }

  .idee-tag-label {
    display: inline-block;
    background: var(--zwart);
    color: var(--wit);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .panel-kaart {
    background: #FFFFFF;
    border: 1px solid var(--zwart);
    border-radius: 4px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-kaart .persona-top { gap: 12px; }

  .toon-label {
    align-self: flex-start;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--kleur-tekst, #FFFFFF);
    background: var(--kleur, var(--accent));
    border-radius: 999px;
    padding: 3px 10px;
  }

  .kernpunt {
    margin: 0;
  }

  .vraag-kader {
    background: var(--kleur, var(--accent));
    color: var(--kleur-tekst, #FFFFFF);
    border-radius: 4px;
    padding: 14px 16px;
  }

  .vraag-kader .vraag-kop {
    display: block;
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .vraag-kader p {
    margin: 0;
  }

  .vervolg-blok {
    margin-top: 4px;
    padding-top: 12px;
    border-top: 1px dashed var(--vlak-rand);
  }

  .vervolg-kop {
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--tekst-zacht);
    margin: 0 0 4px;
  }

  .vervolg-tekst {
    margin: 0 0 10px;
  }

  .suggestie-kader {
    background: #F5F5F5;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 10px 12px;
  }

  .suggestie-kop {
    display: block;
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .suggestie-kader p {
    margin: 0;
  }

  .samenvatting {
    margin-top: 24px;
    background: var(--zwart);
    color: var(--wit);
    border-radius: 4px;
    padding: 24px;
  }

  .samenvatting h3 {
    margin: 0 0 12px;
    font-size: 1.2rem;
  }

  .samenvatting p {
    margin: 0;
    color: #CFCFCF;
  }

  .samenvatting ul {
    margin: 0;
    padding-left: 20px;
  }

  .samenvatting li {
    margin-bottom: 8px;
  }

  .samenvatting li:last-child {
    margin-bottom: 0;
  }

  [hidden] { display: none !important; }

  /* Achtergrond: silhouet provincie Limburg */
  body {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMjAgNTIwIj48cGF0aCBkPSJNNzAsOCBMMTUwLDE1IEwxNjgsNTUgTDE1MCwxMTAgTDEyMCwxNjAgTDEwMCwyMTAgTDExNSwyNjAgTDE0NSwzMDAgTDE1MCwzNTAgTDEzMCw0MDAgTDExMCw0NjAgTDk1LDUwNSBMNzgsNDcwIEw2MCw0MjAgTDUwLDM3MCBMNTUsMzIwIEw0NSwyNjAgTDU1LDIxMCBMNDAsMTYwIEwzNSwxMDAgTDUwLDUwIFoiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0VBRUFFQSIgc3Ryb2tlLXdpZHRoPSI0IiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+");
    background-repeat: no-repeat;
    background-position: right center;
    background-size: auto 70vh;
    background-attachment: fixed;
  }

  @media (max-width: 600px) {
    .voortgang li span:not(.stap-nr) { display: none; }
    .acties { flex-direction: column; }
    .acties .btn, .acties .btn-secundair { width: 100%; text-align: center; }
    body { background-image: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <p class="logo">Het Limburgse Panel</p>
    <ol class="voortgang" id="voortgang">
      <li data-stap="1"><span class="stap-nr">1</span><span>Je idee</span></li>
      <li data-stap="2"><span class="stap-nr">2</span><span>Je panel</span></li>
      <li data-stap="3"><span class="stap-nr">3</span><span>De reacties</span></li>
    </ol>
  </div>
</header>

<main class="container">

  <!-- Scherm 1: Idee invoeren -->
  <section class="scherm" id="scherm-1">
    <h2>Welk idee wil je voorleggen?</h2>

    <label for="titel-input">Titel</label>
    <input type="text" id="titel-input" required>

    <label for="omschrijving-input">Korte omschrijving</label>
    <textarea id="omschrijving-input"></textarea>

    <div class="tags" id="tags" role="group" aria-label="Context">
      <button type="button" class="tag-btn" data-tag="Productconcept">Productconcept</button>
      <button type="button" class="tag-btn" data-tag="Streekinitiatief">Streekinitiatief</button>
      <button type="button" class="tag-btn" data-tag="Evenement">Evenement</button>
      <button type="button" class="tag-btn" data-tag="Marktonderzoek">Marktonderzoek</button>
      <button type="button" class="tag-btn" data-tag="Anders">Anders</button>
    </div>

    <div class="acties">
      <button type="button" class="btn-secundair" id="voorbeeld-btn">Vul voorbeeldidee in</button>
      <button type="button" class="btn" id="naar-scherm2-btn" disabled>Kies je panel →</button>
    </div>
  </section>

  <!-- Scherm 2: Persona's kiezen -->
  <section class="scherm" id="scherm-2" hidden>
    <h2>Wie wil je erover horen?</h2>
    <p class="onderschrift">Kies drie of vier persona's. Hoe verschillender, hoe meer je ziet.</p>

    <div class="persona-grid" id="persona-grid"></div>

    <p class="teller" id="teller">0 van maximaal 4 gekozen</p>

    <div class="acties">
      <button type="button" class="btn-secundair" id="terug-naar-1-btn">← Terug</button>
      <button type="button" class="btn" id="naar-scherm3-btn" disabled>Toon de reacties →</button>
    </div>
  </section>

  <!-- Scherm 3: Panelreacties -->
  <section class="scherm" id="scherm-3" hidden>
    <div class="idee-samenvatting" id="idee-samenvatting"></div>

    <div class="panel-grid" id="panel-grid"></div>

    <div class="samenvatting" id="samenvatting" hidden></div>

    <div class="acties">
      <button type="button" class="btn-secundair" id="wissel-btn">← Wissel persona's</button>
      <button type="button" class="btn" id="opnieuw-btn">Begin opnieuw</button>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  // Vul hier de URL van je eigen Cloudflare Worker in (zie backend/README.md).
  // Zolang dit de placeholder is, gebruikt de app de vaste voorbeeldreacties.
  var BACKEND_URL = 'https://bold-violet-8c58.ronald-d60.workers.dev';

  function backendGeconfigureerd() {
    return typeof BACKEND_URL === 'string' && BACKEND_URL.indexOf('VUL-HIER') === -1;
  }

  function haalAiOp(payload) {
    return fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error('Serverfout bij AI-aanvraag');
      return res.json();
    });
  }

  function haalAiReactieOp(idee, persona) {
    return haalAiOp({
      idee: { titel: idee.titel, omschrijving: idee.omschrijving, tag: idee.tag },
      persona: { naam: persona.naam, rol: persona.rol, karakter: persona.karakter }
    }).then(function (data) {
      if (!data || !data.toon || !data.kernpunt || !data.vraag) {
        throw new Error('Onvolledig AI-antwoord');
      }
      return data;
    });
  }

  function haalAiVervolgOp(idee, persona, paneel) {
    return haalAiOp({
      modus: 'vervolg',
      idee: { titel: idee.titel, omschrijving: idee.omschrijving, tag: idee.tag },
      persona: { naam: persona.naam, rol: persona.rol, karakter: persona.karakter },
      paneel: paneel
    }).then(function (data) {
      if (!data || !data.reactieOpPanel || !data.suggestie) {
        throw new Error('Onvolledig AI-antwoord');
      }
      return data;
    });
  }

  function haalAiSamenvattingOp(idee, paneel) {
    return haalAiOp({
      modus: 'samenvatting',
      idee: { titel: idee.titel, omschrijving: idee.omschrijving, tag: idee.tag },
      paneel: paneel
    }).then(function (data) {
      if (!data || !Array.isArray(data.verbeterpunten) || data.verbeterpunten.length === 0) {
        throw new Error('Onvolledig AI-antwoord');
      }
      return data;
    });
  }

  function plattTekst(inhoud) {
    if (typeof inhoud === 'string') return inhoud;
    return inhoud.map(function (deel) {
      return (deel && typeof deel === 'object') ? deel.titel : deel;
    }).join('');
  }

  var voorbeeldIdee = {
    titel: 'Proef Limburg — een streekbox met het verhaal van de maker',
    omschrijving: 'Een maandelijkse box met seizoensproducten van boeren, kaasmakers en ' +
      'imkers uit Limburg, met bij elk product een kort verhaal over de maker. Niet ' +
      'alleen het product proeven, maar ook de streek en de mensen erachter leren ' +
      'kennen.',
    tag: 'Productconcept'
  };

  var personas = [
    {
      id: 'marij',
      naam: 'Marij Verhoeven',
      rol: 'Trotse Limburger',
      karakter: 'Kent de herkomst van bijna alles op haar bord en is trots op haar streek.',
      kleur: '#FFE600',
      kleurTekst: '#000000',
      reactie: {
        toon: 'trots',
        kernpunt: 'Ik herken veel van deze makers al van de markt in het weekend, en ' +
          'ik vind het mooi dat hun verhaal nu ook bij het product komt. Zorg wel dat ' +
          'dit geen verzameling wordt die vooral voor toeristen is bedacht — ik wil dat ' +
          'ik en mijn buren ons er ook in herkennen.',
        vraag: 'Voelt een Limburger zich hier nog thuis in, of is dit vooral gemaakt ' +
          'voor mensen van buiten de streek?'
      },
      reserve: function (titel) {
        return {
          toon: 'trots',
          kernpunt: ['Bij ', { titel: titel }, ' wil ik vooral weten of dit ook iets is ' +
            'voor mensen die hier al hun hele leven wonen, niet alleen voor bezoekers. ' +

          vraag: ['Voelt een echte Limburger zich thuis bij ', { titel: titel }, ', of is ' +
            'dit vooral voor de buitenwacht bedoeld?']

      }
    },
    {
      id: 'twan',
      naam: 'Twan Königs',
      rol: 'Bourgondische genieter',
      karakter: 'Geniet het meest van eten wanneer het gedeeld wordt, het liefst aan een ' +
        'volle tafel.',
      kleur: '#007BC7',
      kleurTekst: '#FFFFFF',
      reactie: {
        toon: 'gezellig',
        kernpunt: 'Zo’n box klinkt goed, maar voor mij draait het om het moment ' +

      },

        return {

            'niet alleen een aankoop?']

      }
    },
    {
      id: 'fenna',
      naam: 'Fenna de Groot',
      rol: 'Jonge food-avonturier',

    {

      naam: 'Sanne Peeters',
      rol: 'Kritische consument',

      kleurTekst: '#FFFFFF',
      reactie: {
        toon: 'kritisch',
        kernpunt: '‘Streekproduct’ en ‘verhaal van de maker’ klinken ' +

      },
      reserve: function (titel) {
        return {
          toon: 'kritisch',
          kernpunt: ['Bij ', { titel: titel }, ' wil ik eerst weten wie dat verhaal ' +
            'controleert. “Lokaal” en “echt” worden vaak beloofd ' +
            'zonder dat het ergens wordt nagegaan.'],
          vraag: ['Wie checkt of de claims achter ', { titel: titel }, ' ook echt kloppen?']
        };
      }
    },
    {
      id: 'huub',
      naam: 'Huub Smeets',
      rol: 'Streekproducten-ondernemer',
      karakter: 'Verkoopt al twintig jaar zelfgemaakte producten en kent de marges op ' +
        'zijn duimpje.',
      kleur: '#F07800',
      kleurTekst: '#000000',
      reactie: {
        toon: 'zakelijk',
        kernpunt: 'Mooi idee, maar wie neemt het risico als een levering een keer ' +
          'misgaat, en wat houden wijzelf als makers eraan over? Als de marge bij een ' +
          'tussenpartij blijft hangen, doe ik liever zelf de markt op zaterdag.',
        vraag: 'Wat blijft er voor de maker zelf over als dit tussen ons en de klant in ' +
          'komt te staan?'
      },
      reserve: function (titel) {
        return {
          toon: 'zakelijk',
          kernpunt: ['Voor ', { titel: titel }, ' wil ik weten wat de marge is voor de ' +
            'maker zelf, en wie het risico draagt als een levering misgaat. Zonder dat ' +
            'blijft het een mooi idee op papier.'],
          vraag: ['Wat houdt een maker zelf over aan ', { titel: titel }, '?']
        };
      }
    }
  ];

  var state = {
    scherm: 1,
    idee: { titel: '', omschrijving: '', tag: '' },
    gekozen: []
  };

  var titelInput = document.getElementById('titel-input');
  var omschrijvingInput = document.getElementById('omschrijving-input');
  var tagsWrap = document.getElementById('tags');
  var voorbeeldBtn = document.getElementById('voorbeeld-btn');
  var naarScherm2Btn = document.getElementById('naar-scherm2-btn');
  var personaGrid = document.getElementById('persona-grid');
  var teller = document.getElementById('teller');
  var terugNaar1Btn = document.getElementById('terug-naar-1-btn');
  var naarScherm3Btn = document.getElementById('naar-scherm3-btn');
  var ideeSamenvatting = document.getElementById('idee-samenvatting');
  var panelGrid = document.getElementById('panel-grid');
  var samenvattingEl = document.getElementById('samenvatting');
  var wisselBtn = document.getElementById('wissel-btn');
  var opnieuwBtn = document.getElementById('opnieuw-btn');
  var voortgangItems = document.querySelectorAll('#voortgang li');

  function maakAvatarIcon() {
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', '26');
    svg.setAttribute('height', '26');
    svg.setAttribute('aria-hidden', 'true');

    var schouders = document.createElementNS(svgNS, 'path');
    schouders.setAttribute('d', 'M3 23c0-5.4 4.4-8.8 9-8.8s9 3.4 9 8.8');
    schouders.setAttribute('fill', 'currentColor');
    svg.appendChild(schouders);

    var hoofd = document.createElementNS(svgNS, 'circle');
    hoofd.setAttribute('cx', '12');
    hoofd.setAttribute('cy', '8.4');
    hoofd.setAttribute('r', '5.4');
    hoofd.setAttribute('fill', 'currentColor');
    svg.appendChild(hoofd);

    var oogLinks = document.createElementNS(svgNS, 'circle');
    oogLinks.setAttribute('cx', '9.8');
    oogLinks.setAttribute('cy', '8.2');
    oogLinks.setAttribute('r', '0.9');
    oogLinks.setAttribute('fill', 'var(--kleur)');
    svg.appendChild(oogLinks);

    var oogRechts = document.createElementNS(svgNS, 'circle');
    oogRechts.setAttribute('cx', '14.2');
    oogRechts.setAttribute('cy', '8.2');
    oogRechts.setAttribute('r', '0.9');
    oogRechts.setAttribute('fill', 'var(--kleur)');
    svg.appendChild(oogRechts);

    var mond = document.createElementNS(svgNS, 'path');
    mond.setAttribute('d', 'M9.4 10.9c1 1.1 4.2 1.1 5.2 0');
    mond.setAttribute('stroke', 'var(--kleur)');
    mond.setAttribute('stroke-width', '1.1');
    mond.setAttribute('stroke-linecap', 'round');
    mond.setAttribute('fill', 'none');
    svg.appendChild(mond);

    return svg;
  }

  function vulTekstMetTitel(element, inhoud) {
    if (typeof inhoud === 'string') {
      element.textContent = inhoud;
      return;
    }
    inhoud.forEach(function (deel) {
      if (deel && typeof deel === 'object') {
        var sterk = document.createElement('strong');
        sterk.textContent = deel.titel;
        element.appendChild(sterk);
      } else {
        element.appendChild(document.createTextNode(deel));
      }
    });
  }

  function toon(nummer) {
    state.scherm = nummer;
    document.querySelectorAll('.scherm').forEach(function (el) {
      el.hidden = true;
    });
    document.getElementById('scherm-' + nummer).hidden = false;

    voortgangItems.forEach(function (li) {
      var actief = Number(li.getAttribute('data-stap')) === nummer;
      li.classList.toggle('actief', actief);
    });

    if (nummer === 3) {
      renderPanel();
    }

    window.scrollTo(0, 0);
  }

  function bijwerkenNaarScherm2Knop() {
    naarScherm2Btn.disabled = state.idee.titel.trim().length === 0;
  }

  titelInput.addEventListener('input', function () {
    state.idee.titel = titelInput.value;
    bijwerkenNaarScherm2Knop();
  });

  omschrijvingInput.addEventListener('input', function () {
    state.idee.omschrijving = omschrijvingInput.value;
  });

  tagsWrap.addEventListener('click', function (event) {
    var btn = event.target.closest('.tag-btn');
    if (!btn) return;
    var tag = btn.getAttribute('data-tag');
    var nu = btn.classList.contains('gekozen');
    tagsWrap.querySelectorAll('.tag-btn').forEach(function (t) {
      t.classList.remove('gekozen');
    });
    if (nu) {
      state.idee.tag = '';
    } else {
      btn.classList.add('gekozen');
      state.idee.tag = tag;
    }
  });

  voorbeeldBtn.addEventListener('click', function () {
    titelInput.value = voorbeeldIdee.titel;
    omschrijvingInput.value = voorbeeldIdee.omschrijving;
    state.idee.titel = voorbeeldIdee.titel;
    state.idee.omschrijving = voorbeeldIdee.omschrijving;
    state.idee.tag = voorbeeldIdee.tag;
    tagsWrap.querySelectorAll('.tag-btn').forEach(function (t) {
      t.classList.toggle('gekozen', t.getAttribute('data-tag') === voorbeeldIdee.tag);
    });
    bijwerkenNaarScherm2Knop();
  });

  naarScherm2Btn.addEventListener('click', function () {
    if (naarScherm2Btn.disabled) return;
    toon(2);
  });

  function renderPersonaGrid() {
    personaGrid.innerHTML = '';
    personas.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'persona-card';
      btn.setAttribute('data-id', p.id);
      btn.setAttribute('aria-pressed', 'false');
      btn.style.setProperty('--kleur', p.kleur);
      btn.style.setProperty('--kleur-tekst', p.kleurTekst);

      var vinkje = document.createElement('span');
      vinkje.className = 'vinkje';
      vinkje.setAttribute('aria-hidden', 'true');
      vinkje.textContent = '✓';
      btn.appendChild(vinkje);

      var top = document.createElement('div');
      top.className = 'persona-top';

      var avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.appendChild(maakAvatarIcon());
      top.appendChild(avatar);

      var namenWrap = document.createElement('span');
      var naam = document.createElement('span');
      naam.className = 'persona-naam';
      naam.textContent = p.naam;
      var rol = document.createElement('span');
      rol.className = 'persona-rol';
      rol.style.display = 'block';
      rol.textContent = p.rol;
      namenWrap.appendChild(naam);
      namenWrap.appendChild(rol);
      top.appendChild(namenWrap);

      btn.appendChild(top);

      var karakter = document.createElement('p');
      karakter.className = 'persona-karakter';
      karakter.textContent = p.karakter;
      btn.appendChild(karakter);

      btn.addEventListener('click', function () {
        togglePersona(p.id);
      });

      personaGrid.appendChild(btn);
    });
  }

  function togglePersona(id) {
    var idx = state.gekozen.indexOf(id);
    if (idx > -1) {
      state.gekozen.splice(idx, 1);
    } else {
      if (state.gekozen.length >= 4) return;
      state.gekozen.push(id);
    }
    bijwerkenPersonaGrid();
  }

  function bijwerkenPersonaGrid() {
    personaGrid.querySelectorAll('.persona-card').forEach(function (btn) {
      var id = btn.getAttribute('data-id');
      var geselecteerd = state.gekozen.indexOf(id) > -1;
      btn.classList.toggle('geselecteerd', geselecteerd);
      btn.setAttribute('aria-pressed', geselecteerd ? 'true' : 'false');
      btn.disabled = !geselecteerd && state.gekozen.length >= 4;
    });
    teller.textContent = state.gekozen.length + ' van maximaal 4 gekozen';
    naarScherm3Btn.disabled = state.gekozen.length < 3;
  }

  terugNaar1Btn.addEventListener('click', function () {
    toon(1);
  });

  naarScherm3Btn.addEventListener('click', function () {
    if (naarScherm3Btn.disabled) return;
    toon(3);
  });

  function renderPanel() {
    ideeSamenvatting.innerHTML = '';
    var titel = document.createElement('h2');
    titel.textContent = state.idee.titel;
    ideeSamenvatting.appendChild(titel);

    if (state.idee.tag) {
      var tagLabel = document.createElement('span');
      tagLabel.className = 'idee-tag-label';
      tagLabel.textContent = state.idee.tag;
      ideeSamenvatting.appendChild(tagLabel);
    }

    var isVoorbeeld = state.idee.titel.trim() === voorbeeldIdee.titel;
    var gebruikAi = backendGeconfigureerd();

    panelGrid.innerHTML = '';
    samenvattingEl.innerHTML = '';
    samenvattingEl.hidden = true;

    var ronde1Beloftes = [];

    state.gekozen.forEach(function (id) {
      var p = personas.filter(function (item) { return item.id === id; })[0];
      if (!p) return;
      var vasteReactie = isVoorbeeld ? p.reactie : p.reserve(state.idee.titel);

      var kaart = document.createElement('article');
      kaart.className = 'panel-kaart';
      kaart.style.setProperty('--kleur', p.kleur);
      kaart.style.setProperty('--kleur-tekst', p.kleurTekst);

      var top = document.createElement('div');
      top.className = 'persona-top';

      var avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.appendChild(maakAvatarIcon());
      top.appendChild(avatar);

      var namenWrap = document.createElement('span');
      var naam = document.createElement('span');
      naam.className = 'persona-naam';
      naam.textContent = p.naam;
      var rol = document.createElement('span');
      rol.className = 'persona-rol';
      rol.style.display = 'block';
      rol.textContent = p.rol;
      namenWrap.appendChild(naam);
      namenWrap.appendChild(rol);
      top.appendChild(namenWrap);

      kaart.appendChild(top);

      var toonLabel = document.createElement('span');
      toonLabel.className = 'toon-label';
      kaart.appendChild(toonLabel);

      var kernpunt = document.createElement('p');
      kernpunt.className = 'kernpunt';
      kaart.appendChild(kernpunt);

      var vraagKader = document.createElement('div');
      vraagKader.className = 'vraag-kader';
      var vraagKop = document.createElement('span');
      vraagKop.className = 'vraag-kop';
      vraagKop.textContent = 'Vraagt je:';
      var vraagTekst = document.createElement('p');
      vraagKader.appendChild(vraagKop);
      vraagKader.appendChild(vraagTekst);
      kaart.appendChild(vraagKader);

      var vervolgBlok = null;
      var vervolgTekst = null;
      var suggestieTekst = null;

      if (gebruikAi) {
        vervolgBlok = document.createElement('div');
        vervolgBlok.className = 'vervolg-blok';
        vervolgBlok.hidden = true;

        var vervolgKop = document.createElement('p');
        vervolgKop.className = 'vervolg-kop';
        vervolgKop.textContent = 'Reactie op het panel';
        vervolgBlok.appendChild(vervolgKop);

        vervolgTekst = document.createElement('p');
        vervolgTekst.className = 'vervolg-tekst';
        vervolgBlok.appendChild(vervolgTekst);

        var suggestieKader = document.createElement('div');
        suggestieKader.className = 'suggestie-kader';
        var suggestieKop = document.createElement('span');
        suggestieKop.className = 'suggestie-kop';
        suggestieKop.textContent = 'Suggestie:';
        suggestieTekst = document.createElement('p');
        suggestieKader.appendChild(suggestieKop);
        suggestieKader.appendChild(suggestieTekst);
        vervolgBlok.appendChild(suggestieKader);

        kaart.appendChild(vervolgBlok);
      }

      panelGrid.appendChild(kaart);

      function toonReactie(reactie) {
        toonLabel.textContent = reactie.toon;
        vulTekstMetTitel(kernpunt, reactie.kernpunt);
        vulTekstMetTitel(vraagTekst, reactie.vraag);
      }

      var ronde1Belofte;
      if (gebruikAi) {
        toonLabel.textContent = 'denkt na …';
        kernpunt.textContent = 'Even geduld, ' + p.naam + ' denkt na over je idee.';
        ronde1Belofte = haalAiReactieOp(state.idee, p).catch(function () {
          return vasteReactie;
        });
      } else {
        ronde1Belofte = Promise.resolve(vasteReactie);
      }

      ronde1Beloftes.push(ronde1Belofte.then(function (reactie) {
        toonReactie(reactie);
        return {
          id: p.id,
          naam: p.naam,
          rol: p.rol,
          karakter: p.karakter,
          kernpunt: plattTekst(reactie.kernpunt),
          vraag: plattTekst(reactie.vraag),
          vervolgBlok: vervolgBlok,
          vervolgTekst: vervolgTekst,
          suggestieTekst: suggestieTekst
        };
      }));
    });

    if (!gebruikAi) return;

    // Ronde 2: elke persona reageert op de eerste reacties van de anderen.
    Promise.all(ronde1Beloftes).then(function (deelnemers) {
      var ronde2Beloftes = deelnemers.map(function (deelnemer) {
        var anderen = deelnemers.filter(function (d) { return d.id !== deelnemer.id; })
          .map(function (d) { return { naam: d.naam, rol: d.rol, kernpunt: d.kernpunt, vraag: d.vraag }; });

        deelnemer.vervolgBlok.hidden = false;
        deelnemer.vervolgTekst.textContent = deelnemer.naam + ' bekijkt de andere reacties …';

        var persoonInfo = { naam: deelnemer.naam, rol: deelnemer.rol, karakter: deelnemer.karakter };
        return haalAiVervolgOp(state.idee, persoonInfo, anderen).then(function (resultaat) {
          deelnemer.vervolgTekst.textContent = resultaat.reactieOpPanel;
          deelnemer.suggestieTekst.textContent = resultaat.suggestie;
          deelnemer.reactieOpPanel = resultaat.reactieOpPanel;
          deelnemer.suggestie = resultaat.suggestie;
          return deelnemer;
        }).catch(function () {
          deelnemer.vervolgBlok.hidden = true;
          return deelnemer;
        });
      });

      // Ronde 3: een neutrale samenvatting van het hele gesprek.
      Promise.all(ronde2Beloftes).then(function (bijgewerkt) {
        var compleet = bijgewerkt.filter(function (d) { return d.suggestie; });
        if (compleet.length === 0) return;

        samenvattingEl.hidden = false;
        var kop = document.createElement('h3');
        kop.textContent = 'Wat het panel je aanraadt';
        samenvattingEl.appendChild(kop);
        var laden = document.createElement('p');
        laden.textContent = 'Het panel stelt een samenvatting op …';
        samenvattingEl.appendChild(laden);

        var paneelVoorSamenvatting = compleet.map(function (d) {
          return {
            naam: d.naam,
            rol: d.rol,
            kernpunt: d.kernpunt,
            reactieOpPanel: d.reactieOpPanel,
            suggestie: d.suggestie
          };
        });

        haalAiSamenvattingOp(state.idee, paneelVoorSamenvatting).then(function (resultaat) {
          samenvattingEl.innerHTML = '';
          var kop2 = document.createElement('h3');
          kop2.textContent = 'Wat het panel je aanraadt';
          samenvattingEl.appendChild(kop2);
          var lijst = document.createElement('ul');
          resultaat.verbeterpunten.forEach(function (punt) {
            var item = document.createElement('li');
            item.textContent = punt;
            lijst.appendChild(item);
          });
          samenvattingEl.appendChild(lijst);
        }).catch(function () {
          samenvattingEl.hidden = true;
        });
      });
    });
  }

  wisselBtn.addEventListener('click', function () {
    toon(2);
  });

  opnieuwBtn.addEventListener('click', function () {
    state.idee = { titel: '', omschrijving: '', tag: '' };
    state.gekozen = [];
    titelInput.value = '';
    omschrijvingInput.value = '';
    tagsWrap.querySelectorAll('.tag-btn').forEach(function (t) {
      t.classList.remove('gekozen');
    });
    bijwerkenNaarScherm2Knop();
    bijwerkenPersonaGrid();
    toon(1);
  });

  renderPersonaGrid();
  bijwerkenPersonaGrid();
  toon(1);
})();
</script>

</body>
</html>
